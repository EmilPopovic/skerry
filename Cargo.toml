[workspace]
resolver = "3"
members = [
    "crates/sk-util",
    "crates/sk-model",
    "crates/sk-plat",
    "crates/sk-text",
    "crates/sk-fs",
    "crates/sk-cmd",
    "crates/sk-desktop",
    "crates/sk-gpu",
    "crates/sk-index",
    "crates/sk-preview",
    "crates/sk-ui",
    "crates/sk-app",
    "bin/skerry",
    "bin/skerry-thumbnailer",
    "bin/skerry-preview-doc",
    "bin/skerry-archive",
    "tools/skerry-drive",
    "tools/a11y-registry",
]

[workspace.package]
# **A pre-release version, and the first one that is public.** `0.1.0-alpha.1`
# rather than `0.1.0`: the milestones this has not reached are listed in
# `docs/08-roadmap.md`, and a version that claims otherwise is the first thing a
# reader would have to discount. `skerry --version` prints this and the commit.
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
# **Not libraries for anybody else.** These twelve are one application divided
# into levels, and the division is `docs/04-architecture.md`'s rather than an
# offer. Stated because `cargo-deny`'s wildcard check has to know: a crate that
# might be published may not name a dependency by path, so without this every
# `{ workspace = true }` in the tree reads as `version = "*"`.
publish = false

[workspace.dependencies]
sk-util = { path = "crates/sk-util" }
sk-model = { path = "crates/sk-model" }
sk-plat = { path = "crates/sk-plat" }
sk-text = { path = "crates/sk-text" }
sk-fs = { path = "crates/sk-fs" }
sk-cmd = { path = "crates/sk-cmd" }
sk-desktop = { path = "crates/sk-desktop" }
sk-gpu = { path = "crates/sk-gpu" }
sk-index = { path = "crates/sk-index" }
sk-preview = { path = "crates/sk-preview" }
sk-ui = { path = "crates/sk-ui" }
sk-app = { path = "crates/sk-app" }

rustix = { version = "1.1", default-features = false, features = ["std", "fs", "event", "mm", "net", "pipe", "process", "time"] }
# `system` selects the libwayland backend, which is what gives us a real
# `*mut wl_display` for the GPU surface; `dlopen` loads it at run time so the
# binary still starts on a machine that has X11 and no Wayland.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = "0.9"
# `dl-libxcb` for the same reason `wayland-client` takes `dlopen`: an X11-only
# machine and a Wayland-only machine both have to start. It also yields the real
# `xcb_connection_t *` that `VK_KHR_xcb_surface` needs — ADR 0009.
x11rb = { version = "0.14", default-features = false, features = [
    "dl-libxcb",
    "xkb",
    "xfixes",
    "render",
    "cursor",
    "resource_manager",
] }
# Only for `localtime_r`. Already in the graph through `rustix` and
# `xkbcommon`, so it costs no crates — see docs/07-dependencies.md.
libc = "0.2"
swash = "0.2"
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl"] }

# **The decoder tree, and it is in no library.** These three are named here so the
# versions are argued once, and depended on only by `bin/skerry-thumbnailer` and
# `bin/skerry-preview-doc` — which are separate binaries, so none of them is in the
# `skerry` graph `tools/dep-budget.py` measures. That is ADR 0006's dependency
# argument made mechanical rather than aspirational.
png = { version = "0.18", default-features = false }
# **0.5, which is the version `resvg` wants.** At 0.4 the helper built two JPEG
# decoders and two `zune-core`s — `raster-images` brought resvg's own — and a
# sandboxed child with a decoder in it twice is two attack surfaces for one
# format.
# **Deflate and CRC-32, and neither costs a crate.** `png` already brings both
# into every helper's tree, so declaring them here is naming what is there
# rather than adding to it — see docs/07-dependencies.md. `rust_backend` is not
# the default by accident: the alternative links zlib and `tools/no-cc` would
# stop being answerable with "no".
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "system-fonts",
    # **`raster-images`, or an `<image>` inside an SVG draws nothing** — resvg
    # logs "Images decoding was disabled by a build feature" and carries on. Every
    # diagrams.net export puts its labels in a `<foreignObject>` for browsers and
    # a rasterised PNG in `<switch>` beside it for everything else, so those files
    # rendered as boxes and arrows with no words in them. It costs `gif` and
    # `image-webp`; PNG and JPEG come from crates already here.
    "raster-images",
] }

# One lint set for the workspace, so a rule is argued once. The per-crate
# `deny(unwrap_used, expect_used)` stays in each lib.rs because
# tools/check-invariants.py reads it there.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An `unsafe` block is a claim the compiler stopped checking, and the claim is
# only reviewable if it is written down beside the block. A crate with no
# `unsafe` at all says `#![forbid(unsafe_code)]` in its root instead.
undocumented_unsafe_blocks = "warn"
# Device-pixel arithmetic converts between u32, i32 and f32 on nearly every
# line of the renderer and the layout code, and every value is bounded by a
# surface dimension. Denying these would mean a `try_into().unwrap_or()` per
# coordinate, which is noise that hides the arithmetic that matters.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# `sk_text::text::Layout` reads better than `sk_text::Layout` at the call site.
module_name_repetitions = "allow"
# Errors carry a user-facing message by policy (docs/04, error policy); a prose
# `# Errors` section on top of that is duplication, not documentation.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# A modifier set is four booleans by definition, and a bitflags type for four
# bits would be less readable at every call site.
struct_excessive_bools = "allow"
# `wayland-client`'s `Dispatch` signature carries a `&()` user-data parameter on
# every impl; spelling it `(): &()` in eleven places is noise.
ignored_unit_patterns = "allow"
# A colour is written `0xRRGGBB` everywhere in the world, and `0x00RR_GGBB` is
# not an improvement on it.
unusual_byte_groupings = "allow"
unreadable_literal = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# The frame budget is 8 ms. A debug build of the renderer cannot hold it, so the
# dependencies that do arithmetic per pixel are optimized even in dev builds —
# our own crates stay unoptimized so a backtrace is still readable.
[profile.dev.package."*"]
opt-level = 2
