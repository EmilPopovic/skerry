[package]
build = "../skerry/build.rs"
name = "skerry-thumbnailer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# **A helper, not a level.** tools/check-layering.py reads this; a binary is above
# everything and is depended on by nothing, which is what lets it carry the decoder
# tree that ADR 0006 keeps out of the product.
[package.metadata.skerry]
level = 5

[dependencies]
sk-preview = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }
resvg = { workspace = true }
# For `O_NOFOLLOW`, `O_DIRECTORY` and `geteuid` on the thumbnail cache, which
# `std` does not name. Already in this crate's tree through `sk-preview`.
rustix = { workspace = true }

[lints]
workspace = true
