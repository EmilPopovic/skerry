# What a tag produces: one tarball per architecture, and nothing else.
#
# `06-portability.md` names the primary artifact as *one relocatable binary plus
# a small data directory*, for both architectures. This builds exactly that, on
# the two images `check.yml` already uses, so a release is built by the same
# toolchain that gated it.
#
# **No AppImage yet, and no auto-updater.** Both are named in the portability
# document as later work; a tarball with a `Makefile` in it is what a person and
# a packager can both use today, and shipping the smaller thing first is how the
# larger one gets designed against a real complaint.
#
# The tarball is not reproducible byte-for-byte yet — `SOURCE_DATE_EPOCH` and a
# sorted, ownership-stripped archive get most of the way, and the binary itself
# is whatever the runner's linker produced. That is stated rather than claimed
# the other way round.
#
# **Built without a write token, published without building.** `cargo build`
# runs every build script and proc-macro in the graph — 25 on x86-64 by
# `cargo metadata --filter-platform`, none of them written here — so `build`
# holds `contents: read` and leaves no credential in `.git/config`. `publish`
# holds the write token and has no checkout to run: it checks the tarballs
# against their `.sha256`, signs their provenance and attaches them. A
# compromised dependency can still change the tarball it is built into —
# nothing here prevents that — but it can no longer replace an asset on a
# release, and a tarball that did not come out of this workflow fails
# `gh attestation verify`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: ./.github/workflows/check.yml

  validate-filesystems:
    uses: ./.github/workflows/torture.yml

  validate-parsers:
    uses: ./.github/workflows/fuzz.yml

  build:
    needs: [validate, validate-filesystems, validate-parsers]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # One output per architecture, because the legs of a matrix share one set of
    # job outputs: each leg sets only its own, and the runner skips an output
    # that is empty rather than letting it overwrite the other leg's.
    outputs:
      x86_64: ${{ steps.artifact.outputs.x86_64 }}
      aarch64: ${{ steps.artifact.outputs.aarch64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The whole history, because `build.rs` stamps the commit into
          # `--version` and a shallow checkout of a tag still has one.
          fetch-depth: 0
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils libxkbcommon-dev binutils
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Dependency notices
        run: python3 tools/notices.py --check
      - name: What it says it is
        # A binary that cannot name its own version is a binary no bug report can
        # identify, and this is the cheapest possible test of `build.rs`.
        run: ./target/release/skerry --version
      - name: Stage
        id: stage
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          archive=$(python3 tools/package.py --arch "${{ matrix.arch }}" --output dist "${args[@]}")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$archive" .tar.gz)" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_DATE_EPOCH: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.archive }}.sha256
          if-no-files-found: error
      - name: Artifact ID
        id: artifact
        env:
          ARCH: ${{ matrix.arch }}
          ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "$ARCH=$ID" >> "$GITHUB_OUTPUT"

  publish:
    # Both architectures or neither: `needs` waits on every leg of the matrix,
    # so one failed architecture now keeps the other off the release as well.
    # Before the split each leg attached its own tarball, and a tag could
    # publish one architecture with nothing saying the other was missing; now
    # the attestation and the upload are one act over a complete set.
    # `fail-fast: false` still lets the other leg finish, so its artifact is
    # there to inspect.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that can write, and the only one that can sign: a token for
    # either is a token every build script would otherwise have been handed.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: What build uploaded
        # By ID rather than by a name pattern, so an artifact that any other job
        # in this run uploaded under a matching name is neither attested nor
        # published.
        id: ids
        env:
          X86_64: ${{ needs.build.outputs.x86_64 }}
          AARCH64: ${{ needs.build.outputs.aarch64 }}
        run: |
          [[ "$X86_64" =~ ^[0-9]+$ && "$AARCH64" =~ ^[0-9]+$ ]]
          echo "ids=$X86_64,$AARCH64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: dist
          merge-multiple: true
      - name: Checksums
        # A transfer that changed a byte is caught here rather than by the
        # person who downloads it. What a checksum beside its tarball cannot
        # catch is somebody replacing both, which is what the attestation is for.
        working-directory: dist
        run: sha256sum --check --strict -- *.tar.gz.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.tar.gz.sha256
