# Every gate, on every push and every pull request.
#
# `tools/check` is the whole definition of what passing means, and CI adds
# nothing of its own: a gate that exists only here is a gate nobody can
# reproduce, and one that exists only on a laptop is decoration. The jobs below
# differ in what they have to install, not in what they ask.
#
# One harness stays local on purpose: `--bench` on a shared runner measures the
# runner's neighbours, and docs/12-measurement.md prices load contamination at
# 6x. The GUI scenarios used to stay local too, for a reason that stopped being
# true when the X11 backend arrived — see the `scenarios` job.
#
# Two architectures, because 06-portability.md claims two. The `aarch64` job runs
# the same `tools/check` and not a subset of it.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push is asking the same question about better code.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, and a bump is a commit. `clippy -- -D warnings` against a floating
  # `stable` turns a Rust release into a red build on a day nobody touched the
  # code, and the argument about a new lint belongs in a diff.
  RUST: "1.96.1"
  # `rust-version` in Cargo.toml claims this. The `msrv` job is what makes it a
  # claim with a gate behind it.
  MSRV: "1.90"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gates:
    # Pinned rather than `ubuntu-latest`, and 26.04 rather than 24.04: the
    # `frames` job needs this image's font packages to the byte, and one image
    # across the workflow means one story about what CI is.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        # `libxkbcommon-dev` because `#[link(name = "xkbcommon")]` needs the
        # linker symlink. The fonts because twelve places in the tests open with
        # `let Ok(fonts) = Fonts::discover() else { return }` and pass while
        # measuring nothing where there are none — `frames` is what proves the
        # program actually loaded these ones.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default "$RUST"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gates-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gates-${{ env.RUST }}-
      - name: Lockfile
        # `--locked` here and not in `tools/check`: it is the one question only
        # CI has to ask. A person's checkout may update a lockfile; a build of
        # somebody's pull request may not.
        run: cargo fetch --locked
      - name: tools/check
        run: ./tools/check

  frames:
    # The golden frames, which need a software Vulkan, Pillow, and the exact fonts
    # the references were rendered with. The first two are asserted below rather
    # than trusted, because `tools/golden` *skips* where either is missing —
    # right for a person, decoration here. The fonts the harness checks itself,
    # against the hash of every file in `tests/golden/faces.txt`.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev mesa-vulkan-drivers python3-pil \
            fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: frames-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: frames-${{ env.RUST }}-
      - name: What the frames need
        # Either name, because the packaging has used both: this repository's own
        # machine has `lvp_icd.json` where the harness also looks for
        # `lvp_icd.x86_64.json`, and asserting one of them is a precondition that
        # fails on the wrong thing.
        run: |
          ls /usr/share/vulkan/icd.d/lvp_icd.json \
             /usr/share/vulkan/icd.d/lvp_icd.x86_64.json 2>/dev/null | grep -q lvp
          python3 -c "import PIL"
      - name: Build
        run: cargo build --release --locked
      - name: Golden frames
        run: python3 tools/golden
      - name: Keep what it rendered
        # A pixel difference is only a bug report if somebody can look at it.
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rendered-frames
          path: /tmp/skerry-golden/rendered
          if-no-files-found: ignore
          retention-days: 7

  scenarios:
    # **The GUI scenarios, on X11.** These were out of CI entirely: the Wayland
    # half drives a nested compositor through `zwp_virtual_keyboard_manager_v1`
    # and `zwlr_virtual_pointer_manager_v1`, and a compositor only offers those
    # to a real session with a seat — which a runner has not got. `XTEST` needs
    # neither, so the *same* 93 scenarios run against a private `Xvfb` here.
    #
    # The same scenarios and not a second set written for X11: a scenario that
    # has only ever run on one display server is evidence about that server, and
    # running these on a second one immediately found a harness bug that had been
    # latent since it was written — see
    # docs/12-measurement.md#a-helper-can-be-correct-only-because-of-the-fixture-it-grew-up-in.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        # `xvfb` is the server, `x11-utils` is `xwininfo` and `xdpyinfo`,
        # `imagemagick` is `import` for the one scenario that asserts on pixels,
        # and the fonts are the same ones the frames need — a window with no
        # fonts draws no text and the scenarios that read a row would pass on an
        # empty list.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev mesa-vulkan-drivers xvfb x11-utils imagemagick \
            python3-pil fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: scenarios-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: scenarios-${{ env.RUST }}-
      - name: Build
        run: cargo build --release --locked
      - name: Scenarios on X11
        # No GPU on a runner, so the renderer falls back to lavapipe — which is
        # what `frames` already renders with, and which the scenarios do not care
        # about: they assert on the state the window reports, not on its pixels,
        # apart from the one that needs Pillow.
        run: ./tools/gui-test --x11
      - name: Scenarios on X11 at 125%
        # A fractional scale, which on X11 means `Xft.dpi` in the root resource
        # database. At 100% the scale assertions cannot fail.
        run: ./tools/gui-test --x11 --scale=1.25

  aarch64:
    # **The second architecture.** [06-portability.md](../../docs/06-portability.md)
    # claims x86-64 *and* aarch64 are "both built and tested in CI from the first
    # commit", and until now both the gates and the frames were `x86_64` — so the
    # claim had nothing behind it. This is `tools/check` on ARM: the same gates,
    # the same tests, a different word size for every `usize` and a different
    # memory model for every atomic.
    #
    # **Not the golden frames.** `ubuntu-24.04-arm` is the ARM image GitHub
    # offers, and its font packages are not 26.04's — the harness compares the
    # hash of every face file and refuses rather than reporting a million
    # differing samples. `tools/check` skips them by itself when there is no
    # release build, which is what this job leaves.
    #
    # The workspace was checked against `aarch64-unknown-linux-musl` on the
    # machine this was written on, so the job is expected to pass on its first
    # run rather than hoped to; what the job adds is that it keeps passing.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default "$RUST"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aarch64-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: aarch64-${{ env.RUST }}-
      - name: Lockfile
        run: cargo fetch --locked
      - name: tools/check
        run: ./tools/check

  supply:
    # **The two rows of docs/07-dependencies.md that had no gate.** Licences and
    # advisories both named `cargo-deny` as their tool and nothing ran it, so
    # "permissive only, rejected at the gate" was rejected at no gate at all.
    #
    # `tools/check` runs the offline half of this where a person has the tool
    # installed. Here the whole of it runs, `advisories` included, because that
    # check fetches the RustSec database and this is where a network is a given.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
          key: supply-${{ env.RUST }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: supply-${{ env.RUST }}-
      - name: cargo-deny
        run: |
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          cargo deny --workspace check

  no-c-toolchain:
    # **The evidence behind "C toolchain required for `skerry`: no".** That row
    # said "clean-container build in CI", which cannot be what proves it: `rustc`
    # drives linking through `cc` on Linux, so an image with no compiler fails at
    # the link step and says nothing about whether a dependency compiled C.
    #
    # `tools/no-cc` asks the question that can be answered — the `cc` crate
    # honours `$CC` and `rustc`'s linker does not — and a person can run the same
    # script. It needs a cold target directory, so it gets no cache: a warm one
    # re-runs no build scripts, which is a gate that passes by not looking.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - name: Nothing in the graph compiles C
        run: ./tools/no-cc

  msrv:
    # `rust-version = "1.90"` is a promise to anyone whose distribution is a
    # release or two behind. A `check` is enough to keep it: what breaks an MSRV
    # is syntax and library items, not codegen.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Toolchain
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup default "$MSRV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: msrv-${{ env.MSRV }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ env.MSRV }}-
      - name: Build with the oldest supported toolchain
        run: cargo check --workspace --all-targets --locked
