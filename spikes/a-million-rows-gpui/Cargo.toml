# Spike A, arm 2. Standalone by design: not a workspace member, exempt from the
# layering, lint and dependency rules (spikes/README.md). It exists to put a
# number on the alternative to ADR 0001 — a framework that already solved the
# virtualized list — so the choice is measured rather than argued.
[package]
name = "spike-a-million-rows-gpui"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
