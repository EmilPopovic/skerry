# Spike D, arm 1. Standalone by design: not a workspace member, exempt from the
# layering, lint and dependency rules (spikes/README.md). wayland-client, x11rb
# and xkbcommon are exactly the choices under test — everything else here is an
# instrument.
# Standalone, and the empty table below is what makes it so. Without it
# `cargo` walks up to the workspace at the repository root, finds this crate
# is not a member, and refuses to build at all — which is how Spike E's
# torture matrix stopped being runnable the day `crates/` arrived.
[workspace]

[package]
name = "spike-d-platform"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "randr", "xfixes"] }
rustix = { version = "1", features = ["fs", "pipe", "shm", "event", "time", "mm"] }

[profile.release]
opt-level = 3
debug = 1
