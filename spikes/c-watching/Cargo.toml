# Spike C. Standalone by design: not a workspace member, exempt from the
# layering, lint and dependency rules (spikes/README.md).
#
# `rustix` only, and deliberately not the `notify` crate: the question is what
# the kernel interface costs and how it fails, and a cross-platform wrapper
# answers a question about the wrapper's queueing instead.
[package]
name = "spike-c-watching"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustix = { version = "1.1", features = ["fs", "event"] }

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
