# Spike B. Standalone by design: not a workspace member, exempt from the
# layering, lint and dependency rules (spikes/README.md).
#
# `rustix` is the crate under test — the question is what getdents64 and statx
# buy over std. `fuser` is a measurement instrument: it builds the hung mount
# that rule 1's canonical test needs, without root and without a network.
# Standalone, and the empty table below is what makes it so. Without it
# `cargo` walks up to the workspace at the repository root, finds this crate
# is not a member, and refuses to build at all — which is how Spike E's
# torture matrix stopped being runnable the day `crates/` arrived.
[workspace]

[package]
name = "spike-b-enumeration"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
# Optional so the walk arms can be built for a statically linked musl target and
# run on a machine with an older glibc. The hung-mount arm needs /dev/fuse, which
# a container does not have, so excluding it there costs nothing.
fuser = { version = "0.18", default-features = false, optional = true }

[features]
default = ["hang"]
hang = ["dep:fuser"]

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
