# Spike B. Standalone by design: not a workspace member, exempt from the
# layering, lint and dependency rules (spikes/README.md).
#
# `rustix` is the crate under test — the question is what getdents64 and statx
# buy over std. `fuser` is a measurement instrument: it builds the hung mount
# that rule 1's canonical test needs, without root and without a network.
[package]
name = "spike-b-enumeration"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
fuser = { version = "0.18", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
debug = 1
