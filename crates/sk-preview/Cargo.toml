[package]
name = "sk-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Read by tools/check-layering.py. A crate may depend on lower levels only.
[package.metadata.skerry]
level = 2

[dependencies]
sk-model = { workspace = true }
sk-util = { workspace = true }
libc = { workspace = true }
# For `poll` on a child's pipe, so a cancelled listing does not wait out a
# decompressor. Already in this crate's tree through `sk-util`.
rustix = { workspace = true }

[lints]
workspace = true
